{# Logo: medical cross on a teal-to-blue rounded square #}
{% macro logo(size=40) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 48 48" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0b6bcb"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#logoGrad)"/>
  <rect x="20" y="10" width="8" height="28" rx="2.5" fill="#fff"/>
  <rect x="10" y="20" width="28" height="8" rx="2.5" fill="#fff"/>
</svg>
{% endmacro %}

{# Big illustration for the opening page: health card, ECG line, heart, pill, shield #}
{% macro hero_art() %}
<svg class="hero-art" viewBox="0 0 520 440" role="img" aria-label="Medical illustration">
  <defs>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a9b"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f9d8a"/>
    </linearGradient>
  </defs>

  <circle cx="260" cy="220" r="200" fill="url(#haze)"/>
  <circle cx="260" cy="220" r="145" fill="url(#haze)"/>

  <!-- health card -->
  <g class="float">
    <rect x="105" y="115" width="310" height="215" rx="28" fill="#ffffff"/>
    <rect x="135" y="145" width="62" height="62" rx="16" fill="#e8f8f6"/>
    <rect x="159" y="156" width="14" height="40" rx="3" fill="#0fa3a3"/>
    <rect x="146" y="169" width="40" height="14" rx="3" fill="#0fa3a3"/>
    <rect x="215" y="152" width="150" height="13" rx="6.5" fill="#d6e6f5"/>
    <rect x="215" y="176" width="100" height="10" rx="5" fill="#e6eff8"/>
    <rect x="215" y="196" width="125" height="10" rx="5" fill="#e6eff8"/>
    <path class="ecg" d="M135 275 H212 L232 244 L258 304 L282 228 L300 275 H385"
          fill="none" stroke="#0fa3a3" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- heart -->
  <g transform="translate(375 62)">
    <g class="heart">
      <path d="M40 68 C8 44 0 26 0 16 C0 6 8 0 18 0 C28 0 36 6 40 14 C44 6 52 0 62 0 C72 0 80 6 80 16 C80 26 72 44 40 68 Z"
            fill="url(#heartGrad)"/>
    </g>
  </g>

  <!-- pill -->
  <g transform="translate(52 318) rotate(-28)" class="float slow">
    <rect width="96" height="36" rx="18" fill="#ffffff"/>
    <path d="M18 0 H48 V36 H18 A18 18 0 0 1 18 0 Z" fill="#2bb673"/>
  </g>

  <!-- shield with tick -->
  <g transform="translate(378 300)" class="float slow">
    <path d="M44 0 L88 16 V50 C88 76 68 92 44 102 C20 92 0 76 0 50 V16 Z" fill="url(#shieldGrad)"/>
    <path d="M26 50 L40 64 L64 36" fill="none" stroke="#fff" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- plus signs -->
  <g fill="#ffffff" opacity=".7">
    <rect x="70" y="120" width="6" height="22" rx="2"/><rect x="62" y="128" width="22" height="6" rx="2"/>
    <rect x="455" y="225" width="5" height="18" rx="2"/><rect x="448" y="231" width="19" height="5" rx="2"/>
    <rect x="300" y="48" width="5" height="18" rx="2"/><rect x="293" y="54" width="19" height="5" rx="2"/>
  </g>
</svg>
{% endmacro %}

{# Small line icons (24x24) #}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'book' %}
    <path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M18 3v16"/>
  {% elif name == 'link' %}
    <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/>
    <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>
  {% elif name == 'branch' %}
    <circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/>
    <path d="M6 7v10"/><path d="M18 11c0 4-6 4-12 6"/>
  {% elif name == 'globe' %}
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
    <path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>
  {% elif name == 'mic' %}
    <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
  {% elif name == 'search' %}
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
  {% elif name == 'arrow' %}
    <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
  {% elif name == 'alert' %}
    <path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/>
  {% elif name == 'printer' %}
    <path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>
  {% elif name == 'back' %}
    <path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
  {% endif %}
</svg>
{% endmacro %}
